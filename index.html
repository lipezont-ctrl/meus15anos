<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite 15 Anos</title>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      background: #fff;
    }

    .convite {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 420 / 1680; /* proporção da imagem */
      background: url("convite.jpg") no-repeat center top;
      background-size: contain;
    }

    .link {
      position: absolute;
      width: 90px;
      height: 90px;
    }

    /* AJUSTE FINO AQUI */
    .link-local {
      top: 520px;
      left: 60px;
    }

    .link-whatsapp {
      top: 520px;
      right: 60px;
    }
  </style>
</head>

<body>

  <div class="convite">
    <a
      href="https://www.google.com/maps/search/CDL+Palmas"
      class="link link-local"
      target="_blank"
      aria-label="Local da festa">
    </a>

    <a
      href="https://wa.me/5563992096239"
      class="link link-whatsapp"
      target="_blank"
      aria-label="Confirmar presença no WhatsApp">
    </a>
  </div>

</body>
</html>
